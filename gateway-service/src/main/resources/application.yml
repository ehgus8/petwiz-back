server:
  port: 8000

spring:
  application:
    name: gateway-service
  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.metrics.SystemMetricsAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.metrics.web.tomcat.TomcatMetricsAutoConfiguration
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          "[/**]":
            allowed-origins:
              - "http://localhost:5173"
              - "http://hrhub-bucket-front.s3-website.ap-northeast-2.amazonaws.com"
              - "https://3.37.254.91"
              - "https://hrhub.cc"
              - "https://www.hrhub.cc"
              - "http://hrhub.cc.s3-website.ap-northeast-2.amazonaws.com"
              - "https://d1b68kg7x7kpwg.cloudfront.net"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowed-headers:
              - Content-Type
              - Authorization
              - X-Requested-With
            allow-credentials: true
      routes:
        - id: hr
          uri: lb://HR
          predicates:
            - Path=/api/hr/**
          filters:
            - StripPrefix=1
            - AuthorizationHeaderFilter

        - id: notice
          uri: lb://NOTICE
          predicates:
            - Path=/api/notice/**
          filters:
            - StripPrefix=1
            - AuthorizationHeaderFilter

        - id: community
          uri: lb://NOTICE
          predicates:
            - Path=/api/community/**
          filters:
            - StripPrefix=1
            - AuthorizationHeaderFilter

        - id: report
          uri: lb://NOTICE
          predicates:
            - Path=/api/report/**
          filters:
            - StripPrefix=1
            - AuthorizationHeaderFilter

        - id: approval
          uri: lb://APPROVAL
          predicates:
            - Path=/api/approval/**
          filters:
            - StripPrefix=1
            - AuthorizationHeaderFilter
